<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Camera Shop</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <header>
    <h1>📷 Camera Shop</h1>
    <div id="auth-area">
      <span id="user-label" class="hidden"></span>
      <button id="logout-btn" class="hidden">Logout</button>
    </div>
  </header>

  <main>
    <section id="login-section">
      <h2>Login</h2>
      <form id="login-form">
        <input name="usernameOrEmail" placeholder="Username or email" required />
        <input name="password" type="password" placeholder="Password" required />
        <button type="submit">Login</button>
      </form>
      <p class="hint">Try the seeded admin: <code>admin</code> / <code>Admin123!</code></p>
      <p id="login-error" class="error"></p>
    </section>

    <section id="catalog-section">
      <h2>Cameras for sale</h2>
      <p class="hint">
        This list comes from <code>GET /api/cameras</code> — the public endpoint
        the JS frontend hits below.
      </p>
      <div id="camera-list" class="grid">Loading…</div>
    </section>
  </main>

  <script src="app.js"></script>
</body>
</html>
